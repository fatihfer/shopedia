services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    # File .env di folder project (TIDAK di-commit). Compose otomatis
    # memakainya untuk interpolasi ${...} di bawah, jadi tidak perlu
    # flag --env-file lagi. Cukup: docker compose up -d --build
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      RUN_MIGRATIONS: "true"
    volumes:
      - shopedia-storage:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://localhost/up') ? 0 : 1);\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-shopedia}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD dulu di file .env server}
    volumes:
      - shopedia-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  shopedia-storage:
  shopedia-db:
